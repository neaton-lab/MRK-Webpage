<div id="carouselWrapper">
  <ul id="listaCarousel">
    <li data-accName="Item 1">
      <img src="img/header.jpg" alt="Header" draggable="false" />
    </li>
    <li data-accName="Item 2">
      <img src="img/lahmacun.png" alt="Lahmacun" draggable="false" />
    </li>
    <li data-accName="Item 3">
      <img src="img/fries.png" alt="Fries" draggable="false" />
    </li>
    <li data-accName="Item 4">
      <img src="img/plate_1.png" alt="Plate" draggable="false" />
    </li>
  </ul>
  <button class="carousel-btn" id="carousel-prev" aria-label="Anterior">◄</button>
  <button class="carousel-btn" id="carousel-next" aria-label="Siguiente">►</button>
</div>
<script>
  (function () {
    var list = document.getElementById("listaCarousel");
    var total = list.children.length;
    var THRESHOLD = 60;

    function goTo(index, behavior) {
      var target = ((index % total) + total) % total;
      list.scrollTo({ left: target * list.offsetWidth, behavior: behavior || "smooth" });
    }

    function currentIndex() {
      return Math.round(list.scrollLeft / list.offsetWidth);
    }

    document.getElementById("carousel-prev").addEventListener("click", function () {
      goTo(currentIndex() - 1);
    });
    document.getElementById("carousel-next").addEventListener("click", function () {
      goTo(currentIndex() + 1);
    });

    // Mouse drag
    var isDown = false;
    var startX, startScrollLeft;

    list.style.cursor = "grab";

    list.addEventListener("dragstart", function (e) {
      e.preventDefault();
    });

    list.addEventListener("mousedown", function (e) {
      isDown = true;
      list.style.cursor = "grabbing";
      list.style.userSelect = "none";
      startX = e.pageX - list.offsetLeft;
      startScrollLeft = list.scrollLeft;
    });

    list.addEventListener("mousemove", function (e) {
      if (!isDown) return;
      e.preventDefault();
      list.scrollLeft = startScrollLeft - (e.pageX - list.offsetLeft - startX);
    });

    list.addEventListener("mouseup", function (e) {
      if (!isDown) return;
      isDown = false;
      list.style.cursor = "grab";
      list.style.userSelect = "";
      var delta = e.pageX - list.offsetLeft - startX;
      var idx = Math.round(startScrollLeft / list.offsetWidth);
      if (delta < -THRESHOLD) goTo(idx + 1);
      else if (delta > THRESHOLD) goTo(idx - 1);
      else list.scrollTo({ left: startScrollLeft, behavior: "smooth" });
    });

    list.addEventListener("mouseleave", function () {
      if (!isDown) return;
      isDown = false;
      list.style.cursor = "grab";
      list.style.userSelect = "";
      list.scrollTo({ left: startScrollLeft, behavior: "smooth" });
    });

    // Touch
    var touchStartX, touchStartScroll;

    list.addEventListener("touchstart", function (e) {
      touchStartX = e.touches[0].clientX;
      touchStartScroll = list.scrollLeft;
    }, { passive: true });

    list.addEventListener("touchmove", function (e) {
      list.scrollLeft = touchStartScroll - (e.touches[0].clientX - touchStartX);
    }, { passive: true });

    list.addEventListener("touchend", function (e) {
      var delta = e.changedTouches[0].clientX - touchStartX;
      var idx = Math.round(touchStartScroll / list.offsetWidth);
      if (delta < -THRESHOLD) goTo(idx + 1);
      else if (delta > THRESHOLD) goTo(idx - 1);
      else list.scrollTo({ left: touchStartScroll, behavior: "smooth" });
    });
  })();
</script>
